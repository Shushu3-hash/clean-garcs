<div class="relative inline-block">
  <!-- Settings button -->
  <button
    id="settingsBtn"
    class="w-10 h-10 flex items-center justify-center text-[#006B5E] dark:text-teal-400 hover:scale-95 transition-transform duration-200"
    type="button"
  >
    <span class="material-symbols-outlined" data-icon="settings">settings</span>
  </button>

  <!-- Dropdown (hidden by default) -->
  <div
    id="settingsDropdown"
    class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg z-50"
  >
    <!-- Logout button inside dropdown -->
    <button
      onclick="logout()"
      class="w-full flex items-center gap-2 px-4 py-2 rounded-full text-red-700 hover:bg-red-50"
      type="button"
    >
      <span class="material-symbols-outlined">logout</span>
      <span>Log out</span>
    </button>
  </div>
</div>

<main class="max-w-5xl mx-auto px-6 pt-8 space-y-10">
<section class="grid grid-cols-1 md:grid-cols-12 gap-6">
<div class="md:col-span-8 bg-gradient-to-br from-primary to-primary-dim rounded-xl p-8 text-on-primary relative overflow-hidden shadow-lg">
<div class="relative z-10">
<span class="inline-block px-4 py-1 rounded-full bg-on-primary/10 text-xs font-bold tracking-widest uppercase mb-4">Current Status</span>
<h2 id="heroTitle" class="font-headline text-4xl font-extrabold mb-2 tracking-tight">Mastery Overview</h2>
<p id="heroText" class="text-on-primary/80 max-w-md text-sm leading-relaxed mb-6">Your latest skill state is loading…</p>
<div class="w-full h-3 bg-white/20 rounded-full overflow-hidden">
<div id="progressBar" class="h-full bg-tertiary-fixed rounded-full shadow-[0_0_15px_rgba(233,254,144,0.4)]" style="width:0%"></div>
</div>
<div class="flex justify-between mt-2 text-[10px] font-bold uppercase tracking-wider opacity-90">
<span id="xpValue">0 XP</span>
<span id="xpTarget">Live data</span>
</div>
</div>
<div class="absolute top-[-20%] right-[-10%] w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[10%] w-32 h-32 bg-tertiary/20 rounded-full blur-2xl"></div>
</div>
<div class="md:col-span-4 bg-surface-container-lowest rounded-xl p-6 flex flex-col items-center justify-center text-center shadow-sm">
<h3 class="font-headline text-lg font-bold mb-4">Skill Snapshot</h3>
<div id="skillSnapshot" class="text-sm text-on-surface/70 leading-relaxed"></div>
</div>
</section>
<section class="bg-surface-container-low rounded-xl p-8">
<div class="flex items-center justify-between mb-8">
<div>
<h3 class="font-headline text-xl font-bold">Reading Growth</h3>
<p class="text-sm text-on-surface/60">Current mastery bands across your skills</p>
</div>
<div class="flex gap-2">
<span class="px-4 py-1.5 rounded-full bg-primary text-on-primary text-xs font-bold">Live Progress</span>
</div>
</div>
<div id="skillsGrid" class="space-y-4"></div>
</section>
<section class="grid grid-cols-1 md:grid-cols-12 gap-8">
<div class="md:col-span-7 space-y-6">
<div class="flex items-center justify-between">
<h3 class="font-headline text-xl font-bold">Achievement Badges</h3>
</div>
<div id="badgesGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-4"></div>
</div>
<div class="md:col-span-5 bg-surface-container-lowest rounded-xl p-6 shadow-sm flex flex-col">
<div class="flex items-center justify-between mb-6">
<h3 class="font-headline text-lg font-bold">Progress Summary</h3>
</div>
<div id="summaryBox" class="space-y-4 text-sm text-on-surface/70"></div>
</div>
</section>
</main>
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#d4fffb]/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-[0_-20px_40px_rgba(0,53,51,0.06)] rounded-t-[3rem] border-none">
<a class="flex flex-col items-center justify-center text-[#003533]/50 dark:text-slate-500 px-4 py-2 hover:text-[#006B5E] dark:hover:text-[#99ecdb] active:scale-90 transition-all duration-300 ease-out" href="#" onclick="location.href='dashboard.html'; return false;">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-lexend text-[10px] font-medium uppercase tracking-widest mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#003533]/50 dark:text-slate-500 px-4 py-2 hover:text-[#006B5E] dark:hover:text-[#99ecdb] active:scale-90 transition-all duration-300 ease-out" href="#" onclick="location.href='library.html'; return false;">
<span class="material-symbols-outlined" data-icon="import_contacts">import_contacts</span>
<span class="font-lexend text-[10px] font-medium uppercase tracking-widest mt-1">Library</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#96ece7] dark:bg-[#006B5E] text-[#003533] dark:text-[#d4fffb] rounded-full px-5 py-2 scale-110 transition-all active:scale-90 duration-300 ease-out" href="#" onclick="location.href='progress.html'; return false;">
<span class="material-symbols-outlined" data-icon="insights" style="font-variation-settings: &quot;FILL&quot; 1;">insights</span>
<span class="font-lexend text-[10px] font-medium uppercase tracking-widest mt-1">Progress</span>
</a>
</nav>
<script>
  const student = JSON.parse(localStorage.getItem('garcs_student') || '{}');
  const studentName = document.getElementById('studentName');
  const heroTitle = document.getElementById('heroTitle');
  const heroText = document.getElementById('heroText');
  const progressBar = document.getElementById('progressBar');
  const xpValue = document.getElementById('xpValue');
  const xpTarget = document.getElementById('xpTarget');
  const skillSnapshot = document.getElementById('skillSnapshot');
  const skillsGrid = document.getElementById('skillsGrid');
  const badgesGrid = document.getElementById('badgesGrid');
  const summaryBox = document.getElementById('summaryBox');

  if (studentName && student.name) {
    studentName.textContent = student.name;
    }


  const settingsBtn = document.getElementById('settingsBtn');
  const dropdown = document.getElementById('settingsDropdown');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('hidden');
  });

  // Close when clicking anywhere else
  document.addEventListener('click', () => {
    dropdown.classList.add('hidden');
  });

  // (Optional) Close after clicking an item
  dropdown.addEventListener('click', () => {
    dropdown.classList.add('hidden');
  });

  function logout() {
    localStorage.removeItem('garcs_student');
    window.location.href = '/login';
  }
  

  async function loadProgress() {
    

    if (!student.student_id) {
      window.location.href = '/login';
      return;
    }

    const response = await fetch(`/api/progress/${student.student_id}`);
    if (!response.ok) {
      return;
    }

    const data = await response.json();
    const skills = data.skills || [];
    const averageMastery = skills.length ? skills.reduce((sum, skill) => sum + skill.mastery, 0) / skills.length : 0;
    const percent = Math.round(averageMastery * 100);

    if (heroTitle) heroTitle.textContent = `${data.name || 'Student'}'s Mastery`;
    if (heroText) heroText.textContent = `${skills.length} skill areas tracked with live adaptive feedback.`;
    if (progressBar) progressBar.style.width = `${Math.max(5, percent)}%`;
    if (xpValue) xpValue.textContent = `${data.total_points || 0} XP`;
    if (xpTarget) xpTarget.textContent = `${skills.length} skill areas`;

    if (skillSnapshot) {
      const highest = skills.slice().sort((a, b) => b.mastery - a.mastery)[0];
      skillSnapshot.innerHTML = `<p><strong>${highest ? highest.skill_tag : 'No data yet'}</strong> is your strongest area right now.</p>`;
    }

    if (skillsGrid) {
      skillsGrid.innerHTML = skills.map(skill => {
        const masteryPercent = Math.round(skill.mastery * 100);
        return `<div class="rounded-xl bg-surface-container-highest p-4"><div class="flex justify-between items-center mb-2"><span class="font-bold capitalize">${skill.skill_tag}</span><span class="text-sm text-primary">${masteryPercent}% · ${skill.band}</span></div><div class="h-3 bg-surface-container rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width:${masteryPercent}%"></div></div><div class="mt-2 text-xs text-on-surface/60">Next difficulty: ${skill.next_difficulty}</div></div>`;
      }).join('');
    }

    if (badgesGrid) {
      const badges = data.badges && data.badges.length ? data.badges : [{name:'Adaptive Learner', icon:'auto_awesome'}];
      badgesGrid.innerHTML = badges.map(badge => `<div class="aspect-square bg-surface-container-highest rounded-2xl flex flex-col items-center justify-center p-3 text-center border-2 border-primary/10"><div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-2 shadow-sm text-primary"><span class="material-symbols-outlined">${badge.icon || 'stars'}</span></div><span class="text-[10px] font-black leading-tight uppercase tracking-tight">${badge.name}</span></div>`).join('');
    }

    if (summaryBox) {
      summaryBox.innerHTML = `<div class="rounded-xl bg-surface-container p-4"><strong>Points earned:</strong> ${data.total_points || 0}</div><div class="rounded-xl bg-surface-container p-4"><strong>Skills tracked:</strong> ${skills.length}</div><div class="rounded-xl bg-surface-container p-4"><strong>Current band:</strong> ${skills.length ? skills[0].band : 'Weak'}</div>`;
    }
  }

  loadProgress();
</script>
